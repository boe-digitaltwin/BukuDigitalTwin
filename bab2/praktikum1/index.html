<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Sistem Tangki - Smart Water Tank (Simulasi JS - Bab 2)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     BAB 2 — versi HTML + CSS + JS SAJA (tanpa Python, tanpa ESP32).
     Markup di bawah ini SENGAJA dibuat 100% identik dengan versi
     Bab 3 (yang nanti terhubung ke ESP32/MicroPython), supaya:
       1. Tampilan (UI) yang dipelajari di Bab 2 tetap terpakai utuh
          di Bab 3 -- tidak perlu belajar ulang HTML/CSS.
       2. Hanya app.js yang berbeda: di Bab 2 data sensor dibuat oleh
          simulator JavaScript (Math.random dkk), di Bab 3 data itu
          diganti dengan data ASLI dari sensor ultrasonic via fetch()
          ke ESP32.
     File ini bisa langsung dibuka dua kali klik (file://) di browser
     manapun, TANPA perlu menjalankan server/Python sama sekali.
     ============================================================ -->
<div class="app-shell" id="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="side-block" id="card-level" tabindex="0" aria-label="Kartu level air">
      <p class="side-label">Level Air</p>
      <p class="side-value side-value-lg" id="card-level-value">-- %</p>
      <p class="side-trend" id="card-level-trend">Tren: --</p>
    </div>

    <div class="side-block" id="card-status" tabindex="0" aria-label="Kartu status sistem">
      <p class="side-label">Status</p>
      <p class="side-value" id="card-status-value">--</p>
    </div>

    <div class="side-block" id="card-quality" tabindex="0" aria-label="Kartu kualitas data">
      <p class="side-label">Kualitas Data</p>
      <p class="side-value side-value-sm" id="card-quality-value">--</p>
    </div>

    <div class="side-block side-block-pump" id="card-pump" tabindex="0" aria-label="Kartu status pompa">
      <p class="side-label">Pompa</p>
      <p class="side-value" id="card-pump-value">Mati</p>
      <button type="button" class="pump-toggle-btn" id="sidebar-pump-btn">Nyalakan Pompa</button>
    </div>
  </aside>

  <div class="main-area">

    <header class="topbar">
      <div class="topbar-left">
        <h1>Dashboard Smart Water Tank</h1>
        <span class="topbar-status" id="topbar-status">--</span>
      </div>
      <p id="last-update-text" class="last-update">Pembaruan terakhir: menunggu data...</p>
    </header>

    <section class="panel-model" id="panel-model" aria-label="Model visual sistem tangki air">

      <svg viewBox="0 0 700 500"
           xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="Diagram sensor, tangki, katup, dan pompa">

        <defs>
          <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9fdcff"/>
            <stop offset="100%" stop-color="#4da6ff"/>
          </linearGradient>

          <line id="sensorNeckLine" x1="0" y1="0" x2="50" y2="0" stroke="#FFFFFF" stroke-width="2"/>
          <rect id="valvePipeConnector" width="35" height="20" fill="#94A3B8" rx="3"/>
          <rect id="valveFlange" width="8" height="36" fill="#475569" rx="2"/>
          <rect id="pumpPipeConnector" width="40" height="20" fill="#94A3B8" rx="3"/>
          <rect id="pumpFoot" width="20" height="10" rx="2" fill="#1E293B"/>

          <symbol id="sensorSymbol" viewBox="55 10 100 200">
            <rect x="75" y="20" width="50" height="30" fill="#94A3B8" rx="2"/>
            <use href="#sensorNeckLine" x="75" y="28"/>
            <use href="#sensorNeckLine" x="75" y="38"/>

            <rect x="60" y="50" width="80" height="60" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
            <ellipse cx="100" cy="50" rx="40" ry="10" fill="#1E293B"/>

            <rect x="85" y="110" width="30" height="15" fill="#475569" rx="2"/>
            <circle cx="100" cy="125" r="15" fill="#475569" stroke="#1E293B" stroke-width="2"/>

            <path d="M 85 145 A 20 20 0 0 0 115 145" fill="none" stroke="var(--status-color,#0EA5E9)" stroke-width="2.5" stroke-dasharray="3,2"/>
            <path d="M 75 155 A 30 30 0 0 0 125 155" fill="none" stroke="var(--status-color,#0EA5E9)" stroke-width="2" stroke-dasharray="4,3"/>
            <path d="M 65 165 A 40 40 0 0 0 135 165" fill="none" stroke="var(--status-color,#0EA5E9)" stroke-width="1.5" stroke-dasharray="5,4"/>
          </symbol>

          <symbol id="valveSymbol" viewBox="10 5 185 130">
            <use href="#valvePipeConnector" x="15" y="90"/>
            <use href="#valvePipeConnector" x="150" y="90"/>

            <use href="#valveFlange" x="46" y="82"/>
            <use href="#valveFlange" x="146" y="82"/>

            <polygon points="54,82 100,100 54,118" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
            <polygon points="146,82 100,100 146,118" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>

            <circle cx="100" cy="100" r="7" fill="#2563EB"/>
            <line x1="100" y1="100" x2="100" y2="45" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

            <g transform="rotate(25 100 45)">
              <ellipse cx="100" cy="45" rx="32" ry="11" fill="var(--status-fill,#10B981)" stroke="#047857" stroke-width="2.5"/>
              <ellipse cx="100" cy="45" rx="20" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
              <line x1="100" y1="34" x2="100" y2="56" stroke="#FFFFFF" stroke-width="2"/>
              <line x1="68" y1="45" x2="132" y2="45" stroke="#FFFFFF" stroke-width="2"/>
            </g>
          </symbol>

          <symbol id="pumpSymbol" viewBox="10 65 185 100">
            <use href="#pumpPipeConnector" x="15" y="105"/>
            <use href="#pumpPipeConnector" x="145" y="75"/>

            <rect x="50" y="80" width="100" height="70" rx="8" fill="#475569" stroke="#1E293B" stroke-width="2.5"/>
            <rect x="60" y="68" width="80" height="14" rx="3" fill="#1E293B"/>

            <circle cx="80" cy="115" r="35" fill="var(--status-fill,#059669)" stroke="#047857" stroke-width="3"/>
            <circle cx="80" cy="115" r="20" fill="#047857"/>

            <g class="pump-impeller">
              <line x1="80" y1="115" x2="80" y2="99" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
              <line x1="80" y1="115" x2="94" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
              <line x1="80" y1="115" x2="66" y2="123" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
              <circle cx="80" cy="115" r="4" fill="#FFFFFF"/>
            </g>

            <use href="#pumpFoot" x="65" y="142"/>
            <use href="#pumpFoot" x="115" y="142"/>
          </symbol>
        </defs>

        <g transform="translate(17,0)">

          <use href="#sensorSymbol" id="instance-sensor-01"
               x="194" y="6" width="58" height="115" class="status-normal"/>

          <text id="sensor-lvl-label" x="220" y="46" text-anchor="middle"
                font-family="monospace" font-size="6" font-weight="bold"
                fill="#F0F9FF">LVL: --%</text>

          <!-- ============ TANGKI ============ -->
          <rect x="90" y="90" width="260" height="300" fill="none" stroke="#1E293B" stroke-width="2.5"/>
          <rect id="water-level" class="water-level" x="92" y="382" width="256" height="8" fill="url(#waterGradient)"/>

          <g id="tank-gridlines" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" opacity="0.55">
            <line x1="90" y1="165" x2="350" y2="165"/>
            <line x1="90" y1="240" x2="350" y2="240"/>
            <line x1="90" y1="315" x2="350" y2="315"/>
          </g>

          <g id="tank-ruler" font-family="monospace">
            <line x1="78" y1="90" x2="78" y2="390" stroke="#94A3B8" stroke-width="1.5"/>

            <g stroke="#94A3B8" stroke-width="1">
              <line x1="84" y1="120" x2="90" y2="120"/>
              <line x1="84" y1="150" x2="90" y2="150"/>
              <line x1="84" y1="180" x2="90" y2="180"/>
              <line x1="84" y1="210" x2="90" y2="210"/>
              <line x1="84" y1="270" x2="90" y2="270"/>
              <line x1="84" y1="300" x2="90" y2="300"/>
              <line x1="84" y1="330" x2="90" y2="330"/>
              <line x1="84" y1="360" x2="90" y2="360"/>
            </g>

            <g stroke="#1E293B" stroke-width="1.5">
              <line x1="78" y1="90" x2="90" y2="90"/>
              <line x1="78" y1="165" x2="90" y2="165"/>
              <line x1="78" y1="240" x2="90" y2="240"/>
              <line x1="78" y1="315" x2="90" y2="315"/>
              <line x1="78" y1="390" x2="90" y2="390"/>
            </g>
            <g font-size="11" fill="#334155" text-anchor="end">
              <text x="74" y="93">100%</text>
              <text x="74" y="168">75%</text>
              <text x="74" y="243">50%</text>
              <text x="74" y="318">25%</text>
              <text x="74" y="393">0%</text>
            </g>
          </g>

          <line x1="350" y1="245" x2="382" y2="245" stroke="gray" stroke-width="8"/>

          <use href="#valveSymbol" id="instance-valve-01"
               x="382" y="194" width="99" height="69" class="status-warning"/>

          <line x1="466" y1="245" x2="528" y2="245" stroke="gray" stroke-width="8"/>

          <use href="#pumpSymbol" id="instance-pump-01"
               x="528" y="220" width="93" height="50" class="status-critical"
               tabindex="0" role="button" aria-label="Pompa: mati"/>

          <text id="level-label" x="220" y="418" text-anchor="middle"
                font-size="14" font-weight="bold" font-family="monospace" fill="#334155">Level: -- % • Quality: --</text>

          <text x="220" y="446" text-anchor="middle" font-size="19">Tangki</text>

        </g>
      </svg>

    </section>

    <footer class="bottombar">
      <p class="log-text" id="log-text">Log: memulai simulasi...</p>
      <div class="alarm-box" id="panel-alarm" role="alert" aria-live="polite" tabindex="0">
        <span class="alarm-label">Alarm</span>
        <span class="alarm-value" id="alarm-text">Tidak ada alarm aktif.</span>
      </div>
    </footer>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
