<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Home – Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-l">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <div>
      <div class="hdr-title">Smart Home</div>
      <div class="hdr-sub">Praktikum 2 · Dashboard Lengkap — Simulasi</div>
    </div>
  </div>
  <div class="badge"><span class="dot"></span><span id="badgeTxt">0 aktif</span></div>
</header>

<div class="main">

  <!-- PANEL KIRI: Sensor + Perangkat -->
  <aside class="panel">

    <!-- Suhu -->
    <div class="sec-title">Suhu & Kelembapan</div>
    <div class="alert-buzzer" id="alertBuzzer">
      <span>&#9888;</span>
      <span id="alertMsg">Alarm aktif!</span>
    </div>
    <div class="gauge-box">
      <div class="gauge-hdr"><span>SUHU</span><span class="badge-sm">Simulasi</span></div>
      <div class="circ">
        <svg viewBox="0 0 160 160" width="120" height="120">
          <path d="M 30 130 A 60 60 0 1 1 130 130" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="12" stroke-linecap="round"/>
          <path id="gaugeFill" d="M 30 130 A 60 60 0 1 1 130 130" fill="none" stroke="url(#tg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="141" style="transition:stroke-dashoffset .6s"/>
          <defs><linearGradient id="tg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF5722"/><stop offset="50%" stop-color="#FF9800"/><stop offset="100%" stop-color="#FFEB3B"/></linearGradient></defs>
        </svg>
        <div class="gauge-val"><span id="tempNum">--</span><span class="g-unit">°C</span></div>
      </div>
    </div>
    <div class="humid-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4FC3F7" stroke-width="2.2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      <span class="humid-lbl">Kelembapan</span>
      <span class="humid-val"><span id="humNum">--</span>%</span>
    </div>

    <!-- Simulasi slider -->
    <div class="sec-title">Simulasi Sensor</div>
    <div class="sim-box">
      <div class="sim-row"><span>Suhu</span><span id="simTval">27°C</span></div>
      <input type="range" id="simTemp" min="15" max="45" value="27" oninput="simUpdate()">
      <div class="sim-row"><span>Kelembapan</span><span id="simHval">55%</span></div>
      <input type="range" id="simHum" min="20" max="95" value="55" oninput="simUpdate()">
    </div>

    <!-- Perangkat -->
    <div class="sec-title">Perangkat</div>
    <div class="dev-list">
      <div class="dev-card" id="card-lamp">
        <div class="dev-ico ico-lamp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
        </div>
        <div class="dev-info"><div class="dev-name">Lampu</div><div class="dev-st" id="st-lamp">Mati</div></div>
        <label class="tgl"><input type="checkbox" id="tgl-lamp" onchange="handleToggle('lamp',this.checked)"><span class="tgl-track"><span class="tgl-thumb"></span></span></label>
      </div>
      <div class="dev-card" id="card-tv">
        <div class="dev-ico ico-tv">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
        </div>
        <div class="dev-info"><div class="dev-name">Televisi</div><div class="dev-st" id="st-tv">Mati</div></div>
        <label class="tgl"><input type="checkbox" id="tgl-tv" onchange="handleToggle('tv',this.checked)"><span class="tgl-track"><span class="tgl-thumb"></span></span></label>
      </div>
    </div>

    <!-- Aksi cepat & Mode -->
    <div class="sec-title">Aksi Cepat</div>
    <div class="quick-row">
      <button class="qbtn qbtn-on" onclick="setAll(true)">Semua Hidup</button>
      <button class="qbtn qbtn-off" onclick="setAll(false)">Semua Mati</button>
    </div>
    <div class="sec-title">Mode</div>
    <div class="mode-row">
      <button class="mbtn" onclick="activateMode('night')">🌙 Malam</button>
      <button class="mbtn" onclick="activateMode('relax')">🛋 Santai</button>
      <button class="mbtn" onclick="activateMode('away')">🚪 Pergi</button>
      <button class="mbtn" onclick="activateMode('movie')">🎬 Film</button>
    </div>

    <!-- Log -->
    <div class="sec-title">Log Aktivitas</div>
    <div class="log-box">
      <table class="log-tbl">
        <thead><tr><th>Device</th><th>Status</th><th>Waktu</th></tr></thead>
        <tbody id="logBody"><tr><td colspan="3" class="log-empty">Belum ada aktivitas</td></tr></tbody>
      </table>
    </div>

  </aside>

  <!-- RUANGAN SVG -->
  <section class="room-sec">
    <div class="room-wrap">
      <svg id="room" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- Overlay kontrol di atas SVG -->
      <div class="ovl ovl-lamp" id="ovl-lamp">
        <div class="ovl-lbl">Lampu</div>
        <div class="ovl-st" id="ovl-st-lamp">off</div>
        <label class="tgl"><input type="checkbox" id="tgl-lamp-o" onchange="handleToggle('lamp',this.checked)"><span class="tgl-track"><span class="tgl-thumb"></span></span></label>
      </div>
      <div class="ovl ovl-tv" id="ovl-tv">
        <div class="ovl-lbl">TV</div>
        <div class="ovl-st" id="ovl-st-tv">off</div>
        <label class="tgl"><input type="checkbox" id="tgl-tv-o" onchange="handleToggle('tv',this.checked)"><span class="tgl-track"><span class="tgl-thumb"></span></span></label>
      </div>
    </div>
  </section>

</div><!-- /main -->
</div><!-- /app -->

<!-- Toast -->
<div class="toast" id="_t"></div>

<script src="app.js"></script>
</body>
</html>
